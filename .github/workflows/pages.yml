name: Публикация на GitHub Pages

on:
  push:
    # main — штатная ветка публикации; ветка разработки добавлена, чтобы
    # сайт был доступен до слияния.
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать dist/
        run: ./scripts/build.sh

      # Pages включается один раз вручную: Settings → Pages → Source:
      # GitHub Actions. Через API (enablement: true) не выходит —
      # GITHUB_TOKEN не имеет прав на создание сайта.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
