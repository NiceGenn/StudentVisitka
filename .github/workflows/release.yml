name: Релиз

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза без префикса v, например 1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Определить версию
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            value="${{ inputs.version }}"
          else
            value="${GITHUB_REF_NAME#v}"
          fi
          echo "value=${value}" >> "$GITHUB_OUTPUT"

      - name: Собрать архив
        run: ./tools/build.sh "${{ steps.version.outputs.value }}"

      - name: Создать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Версия ${{ steps.version.outputs.value }}
          files: releases/visitka-student-v${{ steps.version.outputs.value }}.zip
          generate_release_notes: true
