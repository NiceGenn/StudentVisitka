name: Релиз

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Определить версию из тега
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Собрать архив
        run: ./scripts/build.sh "${{ steps.version.outputs.value }}"

      - name: Создать релиз
        uses: softprops/action-gh-release@v2
        with:
          name: Версия ${{ steps.version.outputs.value }}
          files: release/visitka-student-v${{ steps.version.outputs.value }}.zip
          generate_release_notes: true
